[package]
name = "app"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }
#
icons = {workspace = true,features = ["leptos"] }
#

http.workspace = true
cfg-if.workspace = true
thiserror.workspace = true
## Helper
tw_merge = { workspace = true, features = ["variant","debug"] }
leptos_ui.workspace = true
strum= { workspace = true , features = ["derive"]}
wasm-bindgen.workspace = true
web-sys= { workspace = true, features = ["Window","Navigator","Clipboard"]}
js-sys.workspace = true
time.workspace = true
serde.workspace = true
validator.workspace = true

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:leptos_axum"]

